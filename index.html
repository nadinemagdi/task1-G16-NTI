<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Appointment Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <div class="doctor-image">
        <img src="img/doctor.jpg" alt="Doctor" />
      </div>

      <div class="form-panel">
        <h1>Doctor Appointment Form</h1>
        <div class="divider"></div>

        <form>
          <div class="row">
            <label for="appt-date">Appointment<br />Date</label>
            <div class="field-wrap">
              <input id="appt-date" type="text" placeholder="mm/dd/yyyy" />
              <span class="date-icon">📅</span>
            </div>
          </div>

          <div class="row">
            <label for="appt-time">Appointment<br />Time</label>
            <div class="field-wrap">
              <input id="appt-time" type="text" placeholder="--:-- --" />
              <span class="time-icon">🕒</span>
            </div>
          </div>

          <div class="row">
            <label>Name</label>
            <div class="split">
              <input type="text" placeholder="First" />
              <input type="text" placeholder="Last" />
            </div>
          </div>

          <div class="row gender-row">
            <label>Gender</label>
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="gender" />
                <span>Male</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="gender" checked />
                <span>Female</span>
              </label>
            </div>
          </div>

          <div class="row">
            <label for="phone">Phone</label>
            <div class="field-wrap single-field">
              <input id="phone" type="text" placeholder="#####" />
            </div>
          </div>

          <div class="row">
            <label>Address</label>
            <div class="split">
              <input type="text" placeholder="city" />
              <input type="text" placeholder="state" />
            </div>
          </div>

          <div class="row textarea-row">
            <label for="query">Your Query</label>
            <div class="field-wrap single-field">
              <textarea id="query"></textarea>
            </div>
          </div>

          <div class="row options-row">
            <label>Appointment<br />Type</label>
            <div class="check-list">
              <label class="check-item">
                <input type="checkbox" checked />
                <span>Cervix checkup</span>
              </label>
              <label class="check-item">
                <input type="checkbox" checked />
                <span>Heart checkup</span>
              </label>
              <label class="check-item">
                <input type="checkbox" />
                <span>Eye check-up</span>
              </label>
              <label class="check-item">
                <input type="checkbox" />
                <span>Hearing Test</span>
              </label>
            </div>
          </div>

          <div class="submit-row">
            <button type="submit">Send</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
